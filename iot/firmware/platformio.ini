; TrustChain smart-box firmware (ESP32 DevKit V1, 30-pin, ESP-WROOM-32)
;
;   pio run -e selftest -t upload && pio device monitor
;
[env]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    mikalhart/TinyGPSPlus@^1.1.0

; Wiring check: prints every sensor once a second.
[env:selftest]
build_src_filter = +<selftest/>

; Crypto check for the on-device signer.
[env:signtest]
build_src_filter = +<signtest/>

; Production tracker. Needs src/tracker/secrets.h (copy secrets.example.h).
[env:tracker]
build_src_filter = +<tracker/>
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7.2.0

; GPS diagnostic: raw NMEA + satellites/SNR/fix status.
[env:gpsdiag]
build_src_filter = +<gpsdiag/>
